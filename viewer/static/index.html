<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U can AI 知识库 · 阅读预览</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>U can AI 知识库</h1>
      <p class="subtitle">浏览 by-audience / by-format / 开放麦档案 / Frank / Jenny</p>
    </div>
    <div class="top-actions">
      <button id="reloadBtn" class="btn secondary" type="button">重新扫描</button>
      <a class="btn link" href="/api/meta" target="_blank" rel="noopener">API</a>
    </div>
  </header>

  <section class="stats" id="statsBar"></section>

  <main class="layout">
    <aside class="panel filters">
      <h2>浏览</h2>
      <label class="field">
        <span>内容库</span>
        <select id="collectionFilter"></select>
      </label>
      <label class="field" id="categoryField">
        <span>子栏目</span>
        <select id="categoryFilter">
          <option value="">全部</option>
        </select>
      </label>
      <label class="field">
        <span>搜索标题 / 路径</span>
        <input id="searchInput" type="search" placeholder="例如：名词动词、开放麦、Context" />
      </label>
      <button id="applyFiltersBtn" class="btn primary" type="button">应用</button>
      <p class="collection-hint muted" id="collectionHint"></p>
    </aside>

    <section class="panel list-panel">
      <div class="list-header">
        <h2>目录</h2>
        <span id="listCount" class="muted">0 篇</span>
      </div>
      <ul id="itemList" class="item-list"></ul>
      <div class="pagination">
        <button id="prevPageBtn" class="btn secondary" type="button">上一页</button>
        <span id="pageInfo" class="muted">第 1 页</span>
        <button id="nextPageBtn" class="btn secondary" type="button">下一页</button>
      </div>
    </section>

    <section class="panel detail-panel">
      <div id="emptyState" class="empty-state">
        <h2>选择左侧文章</h2>
        <p>右侧显示 Markdown 预览。左侧可按「读者入口」或「内容形态」两个维度浏览。</p>
      </div>
      <article id="detailView" class="detail hidden">
        <header class="detail-header">
          <h2 id="detailTitle"></h2>
          <div class="badges" id="detailBadges"></div>
          <div class="detail-meta" id="detailMeta"></div>
        </header>
        <section class="content-panel">
          <div class="content-toolbar">
            <h3>正文</h3>
            <button id="toggleRawBtn" class="btn secondary small" type="button">Markdown 原文</button>
          </div>
          <div id="contentHtml" class="markdown-body"></div>
          <pre id="contentRaw" class="raw-block hidden"></pre>
        </section>
      </article>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
